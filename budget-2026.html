<!DOCTYPE html>
<html lang="ta">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 ஆம் ஆண்டு வரவு செலவுகள் - ஸ்ரீ சக்தி செல்வ கணபதி</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .pdf-page-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: var(--white);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .pdf-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .back-btn {
            background-color: var(--primary-color);
            color: var(--white);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
            border: 2px solid transparent;
        }

        .back-btn:hover {
            background-color: var(--white);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .pdf-title-area {
            flex: 1;
            text-align: center;
        }

        .pdf-title {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin: 0;
            padding: 0 20px;
        }

        .pdf-viewer-container {
            width: 100%;
            height: 80vh;
            border: 2px solid var(--gold);
            border-radius: 8px;
            overflow: hidden;
            background: #f9f9f9;
        }

        .pdf-viewer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            .pdf-header {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            .pdf-title-area {
                text-align: center;
                width: 100%;
            }

            .pdf-viewer-container {
                height: 65vh;
            }

            .pdf-page-container {
                margin: 20px 10px;
            }
        }
    </style>
</head>

<body class="bg-cream">

    <div class="pdf-page-container">
        <div class="pdf-header">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> பின்செல்க
            </a>
            <div class="pdf-title-area">
                <h1 class="pdf-title">[2026 விநாயகர் சதுர்த்தி வரவு–செலவு விவரங்கள்]</h1>
            </div>
        </div>

        <div class="pdf-viewer-container">
            <!-- Append #toolbar=0&navpanes=0&scrollbar=0 to hide download and other controls -->
            <iframe src="vinayakar kovil.pdf" title="PDF Document Viewer"></iframe>
        </div>
    </div>

</body>

</html>
